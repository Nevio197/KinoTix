name: Desktop release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
      mac: ${{ steps.platforms.outputs.mac }}
    steps:
      - name: Select release platforms
        id: platforms
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MAC_RELEASE_ENABLED: ${{ vars.KINOTIX_MAC_RELEASE_ENABLED }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          if [[ "$REPOSITORY_PRIVATE" != "false" ]]; then
            echo "The desktop update feed needs a public repository." >&2
            exit 1
          fi
          export LATEST_RELEASE="$RUNNER_TEMP/kinotix-latest.json"
          status="$(curl --silent --show-error --retry 2 --output "$LATEST_RELEASE" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/latest")"
          case "$status" in
            200) ;;
            404) printf '{}\n' > "$LATEST_RELEASE" ;;
            *) echo "Could not check the current release (HTTP $status)." >&2; exit 1 ;;
          esac
          node <<'NODE'
          const fs = require('node:fs')
          const previous = JSON.parse(fs.readFileSync(process.env.LATEST_RELEASE, 'utf8'))
          const version = tag => /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(tag)?.slice(1).map(BigInt)
          const next = version(process.env.GITHUB_REF_NAME)
          if (!next) throw Error('Expected a stable vX.Y.Z release tag.')
          if (previous.tag_name) {
            const old = version(previous.tag_name)
            const changed = next.findIndex((part, index) => part !== old?.[index])
            if (!old || changed < 0 || next[changed] < old[changed]) {
              throw Error('The tag must be newer than the latest stable release.')
            }
          }
          const mac = process.env.MAC_RELEASE_ENABLED === 'true'
          if (!mac && previous.assets?.some(asset => asset.name === 'latest-mac.yml')) {
            throw Error('Enable KINOTIX_MAC_RELEASE_ENABLED to keep the existing macOS update feed working.')
          }
          const include = [{runner:'windows-2025', script:'windows'}]
          if (mac) include.push({runner:'macos-15', script:'mac'})
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({include})}\nmac=${mac}\n`)
          NODE

  build:
    needs: plan
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --prefix app
      - run: npm ci --ignore-scripts --prefix windows
      - name: Check version and add Supabase client configuration
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./app/package.json").version) process.exit(1)'
          node -e 'const config={url:process.env.SUPABASE_URL,publishableKey:process.env.SUPABASE_PUBLISHABLE_KEY}; if(!require("./app/account-sync.cjs").validConfig(config)) throw Error("Expected a Supabase URL and Publishable Key"); require("node:fs").writeFileSync("app/supabase.json",JSON.stringify(config))'
      - name: Add the Windows update trust key
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINDOWS_UPDATE_PUBLIC_KEY: ${{ vars.KINOTIX_WINDOWS_UPDATE_PUBLIC_KEY }}
        run: |
          node -e 'const fs=require("node:fs"); const config={repository:process.env.GITHUB_REPOSITORY,publicKey:process.env.WINDOWS_UPDATE_PUBLIC_KEY}; require("./app/windows-update-format.cjs").updateConfig(config); fs.writeFileSync("app/windows-update.json",JSON.stringify(config))'
      - name: Build installers
        env:
          KINOTIX_WINDOWS_PUBLISHER: ${{ vars.KINOTIX_WINDOWS_PUBLISHER }}
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_PASSWORD: ${{ secrets.WINDOWS_CSC_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_PASSWORD: ${{ secrets.MAC_CSC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Windows ]]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            if [[ -n "$WINDOWS_CSC_LINK" ]]; then
              : "${KINOTIX_WINDOWS_PUBLISHER:?Missing Windows certificate publisher}"
              export CSC_LINK="$WINDOWS_CSC_LINK"
              export CSC_KEY_PASSWORD="$WINDOWS_CSC_PASSWORD"
              echo 'WINDOWS_AUTHENTICODE=true' >> "$GITHUB_ENV"
            fi
          else
            export KINOTIX_PUBLIC_REPOSITORY="$GITHUB_REPOSITORY"
            export CSC_LINK="${MAC_CSC_LINK:?Missing Mac signing identity}"
            export CSC_KEY_PASSWORD="$MAC_CSC_PASSWORD"
            : "${APPLE_ID:?Missing Apple ID}" "${APPLE_APP_SPECIFIC_PASSWORD:?Missing notarization credential}" "${APPLE_TEAM_ID:?Missing Apple Team ID}"
          fi
          npm run ${{ matrix.script }} --prefix windows
      - name: Verify macOS universal app and update assets
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          app=dist/mac-universal/KinoTix.app
          artifact="KinoTix-$version-macOS-universal"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = 'de.kinotix.desktop'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"
          architectures="$(xcrun lipo -archs "$app/Contents/MacOS/KinoTix")"
          for arch in arm64 x86_64; do [[ " $architectures " == *" $arch "* ]]; done
          codesign --verify --deep --strict "$app"
          signature="$(codesign --display --verbose=4 "$app" 2>&1)"
          grep -q '^Authority=Developer ID Application:' <<< "$signature"
          grep -Fxq "TeamIdentifier=$APPLE_TEAM_ID" <<< "$signature"
          xcrun stapler validate "$app"
          test -s "$app/Contents/Resources/app-update.yml"
          hdiutil verify "dist/$artifact.dmg"
          test -s "dist/$artifact.zip.blockmap"
          grep -Fq "url: $artifact.zip" dist/latest-mac.yml
          zip_digest="$(openssl dgst -sha512 -binary "dist/$artifact.zip" | openssl base64 -A)"
          grep -Fq "sha512: $zip_digest" dist/latest-mac.yml
      - name: Verify signed Windows build
        if: runner.os == 'Windows' && env.WINDOWS_AUTHENTICODE == 'true'
        shell: pwsh
        env:
          KINOTIX_WINDOWS_PUBLISHER: ${{ vars.KINOTIX_WINDOWS_PUBLISHER }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $paths = "dist/win-unpacked/KinoTix.exe", "dist/KinoTix-$version-Windows-x64-Setup.exe"
          foreach ($path in $paths) {
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature for ${path}: $($signature.Status)"
            }
            $publisher = $signature.SignerCertificate.GetNameInfo('SimpleName', $false)
            if ($publisher -cne $env:KINOTIX_WINDOWS_PUBLISHER.Trim()) {
              throw "The signing certificate does not match KINOTIX_WINDOWS_PUBLISHER for $path."
            }
          }
      - name: Sign the Windows update manifest
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_UPDATE_PRIVATE_KEY: ${{ secrets.KINOTIX_WINDOWS_UPDATE_PRIVATE_KEY }}
        run: |
          if (!$env:WINDOWS_UPDATE_PRIVATE_KEY) { throw 'Missing KinoTix release key' }
          $keyFile = New-TemporaryFile
          try {
            [IO.File]::WriteAllBytes($keyFile.FullName, [Convert]::FromBase64String($env:WINDOWS_UPDATE_PRIVATE_KEY))
            $version = $env:GITHUB_REF_NAME.Substring(1)
            node scripts/sign-windows-release.cjs "dist/KinoTix-$version-Windows-x64-Setup.exe" $keyFile.FullName
            if ($LASTEXITCODE -ne 0) { throw 'Failed to sign update manifest' }
          } finally {
            Remove-Item -LiteralPath $keyFile.FullName -Force
          }
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.script }}
          if-no-files-found: error
          path: |
            dist/KinoTix-*
            dist/kinotix-windows-x64.json*
            dist/latest*.yml

  release:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          path: dist
          merge-multiple: true
      - name: Publish complete release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAC_RELEASE_ENABLED: ${{ needs.plan.outputs.mac }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          files=(
            "dist/KinoTix-$version-Windows-x64-Setup.exe"
            dist/kinotix-windows-x64.json
            dist/kinotix-windows-x64.json.sig
          )
          if [[ "$MAC_RELEASE_ENABLED" == "true" ]]; then
            files+=(
              "dist/KinoTix-$version-macOS-universal.dmg"
              "dist/KinoTix-$version-macOS-universal.zip"
              "dist/KinoTix-$version-macOS-universal.zip.blockmap"
              dist/latest-mac.yml
            )
          fi
          for file in "${files[@]}"; do test -s "$file"; done
          if draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$draft" != "true" ]]; then
              echo "This release is already published." >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag --generate-notes --draft
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
